  - id: W41-05
    status: approved
    category: Ordinances
    jurisdiction: City of Marlowe Falls, Halden County
    title: Marlowe Falls battery fire-safety ordinance amended ahead of its second reading
    short_title: Marlowe Falls battery fire-safety ordinance (No. 2026-41)
    summary: |
      The Safety Committee amended Ordinance 2026-41 on October 5. As amended, it applies to battery energy storage systems larger than 600 kWh (up from 50 kWh), other than systems serving a single one- or two-family home. It requires compliance with NFPA 855, an emergency response plan approved by the fire chief before a certificate of occupancy is issued, a site walkthrough with the fire department once a year (down from twice a year) and a 24-hour emergency contact posted at each entrance.
    why_it_matters: Systems of 600 kWh or less would not be covered. City council holds the second reading on October 19.
    source_name: City of Marlowe Falls, Ordinance 2026-41 as amended (PDF)
    source_url: https://www.marlowefalls.example/council/legislation/ord-2026-41-amended.pdf
    source_ref: sections 1 to 5; committee amendments on page 2
    date: 2026-10-05
    deadline: 2026-10-19T19:00
    deadline_label: City council second reading
    deadline_location: Council Chambers, Marlowe Falls City Hall, 12 Main Street
    tags: [ordinance, fire-safety, marlowe-falls]
    checked_by: AB
    checked_on: 2026-10-08

