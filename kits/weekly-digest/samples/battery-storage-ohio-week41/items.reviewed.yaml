items:
  - id: W41-01
    status: approved
    priority: high
    category: Moratoria
    jurisdiction: Tarrow County
    title: Tarrow County to consider a 12-month pause on battery storage zoning applications
    short_title: Tarrow County vote on a 12-month battery storage pause (Res. 2026-118)
    summary: |
      Commissioners will take up Resolution 2026-118 at their October 13 regular session. It would stop the county from accepting or processing zoning permits, rezonings (zoning map amendments) and conditional use requests for battery energy storage facilities of 1 MW or more for 12 months.

      It covers the areas under county zoning, currently Ferris, Quill and Brindle townships; townships that run their own zoning are not affected. Applications filed and found complete before it takes effect, and batteries that serve a single home or business on the same property, are excluded.
    why_it_matters: As drafted, the pause takes effect on the day it is adopted. The county zoning commission would then have nine months to recommend setback, fire-safety and decommissioning standards.
    source_name: Tarrow County Board of Commissioners, agenda for October 13, 2026 (PDF)
    source_url: https://www.tarrowcounty.example/commissioners/agendas/2026-10-13-agenda.pdf
    source_ref: page 2, item 7
    date: 2026-10-06
    deadline: 2026-10-13T09:30
    deadline_label: Commissioners' session (public comment at the start)
    deadline_location: Commissioners' Chambers, Tarrow County Administration Building, 41 Court Street, Tarrow City
    details:
      Resolution: "2026-118"
      Covers: Battery storage facilities of 1 MW or more
      Length: 12 months from adoption, unless ended earlier
    tags: [moratorium, tarrow-county]
    checked_by: AB
    checked_on: 2026-10-08

  - id: W41-02
    status: approved
    category: Zoning rules
    jurisdiction: Wrenfield Township, Tarrow County
    title: "Wrenfield Township proposes battery storage rules: I-1 district only, 300-foot setbacks, removal bond"
    short_title: Wrenfield Township battery storage rules (ZTA-2026-03)
    summary: |
      Zoning text amendment ZTA-2026-03 would add definitions for battery energy storage systems and allow battery energy storage facilities only as a conditional use in the I-1 Light Industrial district. It would require setbacks of at least 300 feet from existing homes and 100 feet from property lines, a decommissioning plan backed by a bond or letter of credit and reviewed every five years, and a fire-safety plan reviewed by the fire chief before a zoning certificate is issued.
    why_it_matters: Written comments close on October 16. After the October 21 hearing, the township zoning commission sends its recommendation to the township trustees.
    source_name: Wrenfield Township, notice of public hearing on ZTA-2026-03 (PDF)
    source_url: https://www.wrenfieldtwp.example/notices/ZTA-2026-03-hearing-notice.pdf
    source_ref: proposed amendments 1 to 5
    date: 2026-10-05
    deadline: 2026-10-21T19:00
    deadline_label: Township zoning commission public hearing
    deadline_location: Wrenfield Township Hall, 8 Gable Road
    more_dates:
      - date: 2026-10-16T16:00
        label: Written comments due to the Zoning Inspector
    details:
      Amendment: ZTA-2026-03
      Setbacks: 300 ft from existing homes, 100 ft from property lines
      Where allowed: I-1 Light Industrial, as a conditional use
    tags: [zoning-text-amendment, setbacks, wrenfield-township]
    checked_by: AB
    checked_on: 2026-10-08

  - id: W41-03
    status: approved
    category: Rezonings and applications
    jurisdiction: Wrenfield Township, Tarrow County
    title: 48-acre rezoning sought for an 80 MW battery project on Kessler Road
    short_title: Kessler Road battery project rezoning, Wrenfield Township (RZ-26-014)
    summary: |
      Northbank Storage Partners LLC asks to rezone about 48.2 acres on the north side of Kessler Road from A-1 Agricultural to I-1 Light Industrial for a battery energy storage facility of about 80 MW / 320 MWh, as stated in the application (case RZ-26-014).
    why_it_matters: The Kestrel Regional Planning Commission holds the first public hearing and makes a recommendation on October 22. The township zoning commission then holds its own hearing before the township trustees decide. The same township is also considering the new battery storage rules above.
    source_name: Kestrel Regional Planning Commission, agenda for October 22, 2026 (PDF)
    source_url: https://www.kestrelrpc.example/agendas/current-agenda.pdf
    source_ref: page 1, item 3a; case summary on page 2
    date: 2026-10-05
    deadline: 2026-10-22T18:00
    deadline_label: Planning commission hearing and recommendation
    deadline_location: RPC Meeting Room, 210 Pike Street, Tarrow City
    details:
      Case: RZ-26-014
      Applicant: Northbank Storage Partners LLC
      Size: About 80 MW / 320 MWh (per the application)
      Zoning: A-1 Agricultural to I-1 Light Industrial
    tags: [rezoning, wrenfield-township]
    checked_by: AB
    checked_on: 2026-10-08
    review_notes: The link is a "current agenda" file that the commission replaces each month, so the source name says which meeting it is.

  - id: W41-04
    status: approved
    category: Rezonings and applications
    jurisdiction: Larch Township, Halden County
    title: 20 MW battery storage project files for a conditional use in Larch Township
    summary: |
      Greyline Energy Storage LLC filed conditional use application CU-2026-031 on October 2 for "Larch Storage", a 20 MW battery energy storage facility on about 6.5 acres on the south side of Tolland Road, east of the Larch substation.
    why_it_matters: The county lists the application as received, with a Board of Zoning Appeals hearing still to be scheduled. We will add the hearing date when the county posts it.
    source_name: Halden County open data, zoning applications (case CU-2026-031)
